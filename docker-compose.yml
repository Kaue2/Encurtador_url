services:
  app:
    container_name: encurtador_app
    build: .
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_USER=kaue
      - POSTGRES_PASSWORD=kaue123
      - POSTGRES_DB=encurtador
      - DB_HOST=postgres 
      - DB_PORT=5432
      - REDIS_HOST=redis:6379
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: encurtador_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kaue
      POSTGRES_PASSWORD: kaue123
      POSTGRES_DB: encurtador
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: encurtador_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: